aid: kraken-technologies
url: https://raw.githubusercontent.com/api-evangelist/kraken-technologies/refs/heads/main/apis.yml
name: Kraken Technologies
kind: company
description: >-
  Kraken Technologies is the United Kingdom energy technology company behind Kraken, the licensed
  cloud operating system for utilities. Founded in 2016 inside Octopus Energy and spun out as an
  independent business, Kraken says it supports more than 90 million customer accounts for licensees
  including E.ON Next, EDF, Origin, Tokyo Gas, National Grid, Good Energy, Plenitude, Energy
  Queensland, Essential Energy, Portsmouth Water and TalkTalk across electricity, gas, water and
  broadband. It sits one layer behind the utility rather than in front of the consumer: it does not
  hold a supply licence, does not settle in the wholesale market and does not publish grid or market
  data, so the retailers and networks it powers carry the regulatory obligations, not Kraken. Its API
  posture matches that position and is honestly closed. The Open Kraken programme publicly advertises
  APIs, events, embedded apps, Flow automation and an MCP-based AI access layer, but every reference
  surface is gated: docs.kraken.tech forces SSO login on every path, no base URL or endpoint is
  published anywhere, the Tako design-system package requires a private npm token issued by email,
  and the Marketplace runs under signed access-and-use terms. There is no self-serve developer
  signup, no consumer data-portability API of its own, and no open market data.
