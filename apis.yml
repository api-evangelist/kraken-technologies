- aid: kraken-technologies:open-kraken-ai-access-layer-mcp
  name: Open Kraken AI Access Layer (MCP)
  description: >-
    An AI access layer that Kraken announced as an expansion of Open Kraken, built using the Model
    Context Protocol and described as MCP gateways that let a utility's own AI agents orchestrate
    approved actions across Kraken, with fair use included. Kraken states the layer is being
    gradually released. No MCP server URL, tool list, scope model or transport is published; a probe
    of mcp.kraken.tech on 2026-07-27 did not resolve. MCP is the only protocol Kraken names for this
    surface, and it is an agent-integration protocol rather than an energy data standard.
  humanURL: https://www.kraken.tech/open-kraken
