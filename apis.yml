apis:
- aid: kraken-technologies:open-kraken-apis-and-events
  name: Open Kraken APIs and Events
  description: >-
    Open Kraken is the integration layer of the Kraken utility operating system. Kraken publicly
    describes it as "APIs, events and MCP" for building apps and experiences against data and
    capabilities inside Kraken and for bringing data in from a licensee's own apps and third-party
    tools, alongside the Flow drag-and-drop automation tool and Embedded Apps that render inside the
    Kraken agent desktop. No base URL, endpoint list, authentication scheme or machine-readable
    contract is published anywhere on the public web. The reference documentation at
    docs.kraken.tech returns an SSO login wall on every path probed on 2026-07-27, including
    /openapi.json, /llms.txt and /.well-known/openid-configuration, each of which redirects to
    /auth/login/ and serves text/html rather than a spec. Access is available only to Kraken
    licensees and contracted partners.
  humanURL: https://www.kraken.tech/open-kraken
