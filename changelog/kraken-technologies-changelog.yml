  change log exists for Open Kraken, because no API version is public. Two real changelogs do exist
  publicly, both for the Tako design system, generated by Changesets and rendered in the public
  Storybooks. They are versioned (semver) but not dated. The marketing "Latest updates" page is a
  periodic product roundup with no versions or dates.
