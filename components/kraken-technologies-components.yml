summary: >-
  Tako is Kraken's design system and the one genuinely rich developer artifact Kraken publishes
  anonymously. Two libraries ship: Tako React (@krakentech/tako) and Tako HTML
  (@krakentech/tako-html). The documentation, component inventory and release notes are public
  Storybooks; the npm packages themselves are served from Kraken's private registry and require a
  read-only token issued by Kraken. Components are used to build Kraken Embedded Apps that render
  inside the Kraken agent desktop.
