summary: >-
  Kraken Technologies publishes no client library for the Kraken (Open Kraken) API — there is no
  public base URL for one to target. What it does publish, first-party and verifiable, is (a) a set
  of open-source Python/Django engineering libraries on PyPI under the octoenergy and kraken-tech
  GitHub orgs, and (b) the Tako design-system packages, which are real and named in a public
  package.json but are served from Kraken's PRIVATE npm registry and cannot be installed
  anonymously. No package below is an API client, so no `SDKs` pointer is wired into apis.yml.
