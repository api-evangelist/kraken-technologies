aid: kraken-technologies
name: Kraken Technologies
review:
  question: >-
    Does Kraken Technologies publish a real, publicly reachable developer or API surface, and does any
    energy data mandate attach to the organization itself?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: energy-data-platform
  primaryDomain: kraken.tech
  outcome: >-
    Identity captured. No public developer portal, no machine-readable contract, no published base
    URL. Everything Kraken calls Open Kraken is real as a product but gated behind a licensee SSO
    wall. No mandate attaches to Kraken itself; it is an unregulated software vendor whose licensees
    carry the obligations.

mandate:
  regime: none
  status: not-applicable
  verbatim: >-
    Kraken Technologies is a technology vendor, not a licensed energy supplier, network operator or
    accredited data recipient. The obligations that shape this sector attach to its customers, not to
    it. In Great Britain the Smart Energy Code and the licensed Data Communications Company monopoly
    bind energy suppliers and network operators; Elexon's Balancing and Settlement Code binds BSC
    parties; the Ofgem supply licence binds retailers. Kraken holds none of these roles in its own
    name. Britain also has no consumer data-portability mandate equivalent to the Australian Consumer
    Data Right, so even Kraken's UK licensees are under an infrastructure mandate, not a data right.
  whyNotSmartMeterInfrastructure: >-
    The `smart-meter-infrastructure` regime was considered and rejected for THIS organization. The
    DCC/SEC obligation is a licence condition on suppliers and networks. Kraken builds the systems
    those parties use to meet it, but the duty is theirs. Recording Kraken as covered by the regime
    would let a customer's obligation imply a vendor's compliance, which is exactly the conflation
    this review is meant to prevent.
  australianCdrCheck:
    performed: true
    date: '2026-07-27'
    method: >-
      Queried the public Consumer Data Right register endpoint
      GET https://api.cdr.gov.au/cdr-register/v1/all/data-holders/brands/summary with header x-v: 1.
    httpStatus: 200
    contentType: application/json
    brandsReturned: 203
    krakenBrandsFound: 0
    finding: >-
      Kraken Technologies does not appear in the Australian CDR register of data holder brands. Its
      Australian licensees (Origin Energy, Energy Queensland/Ergon Energy, Essential Energy) carry
      any CDR-energy obligation in their own names. Kraken is not a designated data holder and is not
      an accredited data recipient.
  claimsVsImplementation: >-
    Kraken makes no public compliance claim about a consumer data API and no public claim to
    implement Green Button, ESPI, the CDR Consumer Data Standards, or any other energy data standard.
    There was therefore no claim to downgrade to `live-claimed-unverified`. The honest reading is
    that no mandate applies and none is implemented.

dataStandard:
  energyStandardFound: false
  value: no standard reference found
  detail: >-
    No mention of Green Button, ESPI, CDR Consumer Data Standards (energy), OCPP, OCPI, OpenADR,
    IEEE 2030.5 or IEC CIM 61968/61970 was found on kraken.tech, in its sitemap of 155 English-language
    pages, in the Open Kraken pages, or in the press release announcing the AI access layer. The only
    protocol Kraken names publicly is MCP (Model Context Protocol), used for its AI access layer.
    MCP is an agent-integration protocol, not an energy data standard. Kraken markets a proprietary
    "single data model" for utilities; no schema for it is published.

consumerVsMarketData:
  consumerDataApi: false
  consumerDataDetail: >-
    Kraken publishes no API through which a third party can obtain an individual customer's usage or
    billing data. Kraken is the processor sitting behind the utility; the customer relationship, and
    any consumer-facing API, belongs to the licensee. The clearest example is Octopus Energy, whose
    public developer portal at developer.octopus.energy exposes Kraken-backed REST and GraphQL
    consumption, meter-point and tariff APIs — but that is Octopus's surface published under Octopus's
    brand and supply licence, profiled separately in the API Evangelist network as `octopus-energy`.
    Nothing equivalent exists under kraken.tech.
  marketDataOpen: false
  marketDataDetail: >-
    Kraken publishes no open grid, market, settlement or emissions data. It is not a system operator,
    market operator or network company. In its home market the genuinely open feeds belong to other
    parties — NESO's Carbon Intensity API, Elexon's BMRS/Insights, and the DNO open-data portals —
    none of which Kraken operates or republishes. Probes for data.kraken.tech returned no DNS
    resolution.
  theSplit: >-
    Kraken is closed on both axes, which is the finding. The UK seam produces an unusually API-native
    energy sector, but the API-native part lives at the retailer (Octopus) and at the system operator
    (NESO), not at the platform vendor that licenses the software. Kraken's value is sold to
    utilities, so its integration surface is priced and gated as part of a licence rather than
    published.

accessGate:
  value: partner-only
  gated: true
  whatADeveloperMustDo: >-
    There is no self-serve signup and no public application form for API access. A developer must be
    working for, or contracted to, a Kraken licensee. Concretely: (1) the utility signs a Kraken
    licence — the only public entry points on kraken.tech are "Request a demo", "Consult Kraken"
    (disallowed in robots.txt) and the BPO Partner Program; (2) the developer is then issued SSO
    credentials for docs.kraken.tech, which offers "Log in via SSO" plus an ad-hoc email/password
    fallback and serves the login page for every path including /openapi.json and /robots.txt; (3)
    to build Embedded Apps, the developer must email tako@kraken.tech to have a private-npm token
    generated for the Tako design system, per the public kraken-apps-examples README; (4) Marketplace
    use runs under separate signed access-and-use terms and a fair-use policy. Nothing in this chain
    is obtainable anonymously.
  publicSurfacesThatAreNotGated:
  - https://www.kraken.tech/ (marketing)
  - https://www.kraken.tech/open-kraken (marketing description of the integration layer)
  - https://tako.kraken.tech/ (Tako design system documentation site, public; the npm package is not)
  - https://github.com/kraken-tech/kraken-apps-examples (public example app; depends on token-gated Tako)

authModel:
  apiAuthScheme: not published
  detail: >-
    No API authentication scheme is documented publicly — no API key format, no OAuth2 flows, no
    scopes, no mTLS profile, no CDR accreditation. The only auth surface observable anonymously is
    the documentation portal's own login: docs.kraken.tech offers SSO ("Log in via SSO", form POST to
    /auth/login/) with an ad-hoc email/password alternative at /auth/login/ad-hoc/. The portal is a
    Django application. An anonymous fetch of https://docs.kraken.tech/.well-known/openid-configuration
    returned HTTP 200 but with content-type text/html and a final URL of
    /auth/login/?next=/.well-known/openid-configuration/ — it is the login page, not an OIDC discovery
    document. No OIDC metadata is served anonymously on any Kraken host probed.
  scopesFound: 0

