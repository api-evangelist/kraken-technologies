findings:
  summary: >-
    Kraken Technologies is the clearest case in this sector of a mandate belonging to somebody else.
    Britain mandated infrastructure — the licensed DCC monopoly, the Elexon settlement code — and did
    not mandate a consumer data right. Kraken sits behind every one of those obligations as the
    software its licensees run, and carries none of them itself. It is not in the Australian CDR
    register even though three of its licensees operate in Australia. It implements no named energy
    data standard. It publishes no open market data and no consumer data API. Its Open Kraken
    integration layer is real and actively marketed — APIs, events, Embedded Apps, Flow, and an
    MCP-based AI access layer being gradually released — but not one endpoint, base URL, scope or
    machine-readable contract exists on the public web, and docs.kraken.tech returns a login page for
    every path including /robots.txt. The UK's API-native reputation in energy is earned by Octopus
    Energy and NESO, not by the platform vendor underneath them.
  developerPortal:
    url: https://docs.kraken.tech/
    confirmed: false
    reason: >-
      Reachable but not a real self-serve portal. Every path redirects to /auth/login/. Access
      requires credentials issued to a licensee. Recorded as portal_confirmed=false.
  specsHarvested: 0
  openapiDirectoryCreated: false
  apisListed: 2
  apiFamilyAsKrakenSegmentsIt:
  - Kraken Customer — customer management, billing and payments, cash collection
  - Kraken Field — field job scheduling and routing
  - Kraken Distribution — network and distribution management, network billing, settlement flows
  - Kraken Residential Flexibility — DER scheduling, demand response, tariff optimisation
  - Kraken Generation Flexibility / Asset Optimization — battery and generation portfolio trading
  - Kraken Configuration and CI/CD — tenant configuration and deployment tooling
  - Open Kraken — Embedded Apps, Flow, APIs and events, MCP AI access layer, Marketplace
  companyFacts:
    founded: 2016, inside Octopus Energy
    independence: Spun out of Octopus Energy Group as an independent business
    employees: over 2,000 (company statement)
    customerAccountsSupported: over 90 million (company statement)
    sectors: electricity, gas, water, broadband
    namedLicensees:
    - E.ON Next
    - EDF
    - Origin Energy
    - Tokyo Gas
    - National Grid
    - Good Energy
    - Plenitude
    - Energy Queensland / Ergon Energy
    - Essential Energy
    - Portsmouth Water
    - TalkTalk
    - Saint John Energy
    - Norlys
    - Maingau
  homonymTrap: >-
    "Kraken" collides with the Kraken cryptocurrency exchange (kraken.com, docs.kraken.com) and with
    the KrakenD API gateway (krakend.io). Both surfaced ahead of kraken.tech in web search and both
    publish real APIs and MCP servers. None of their artifacts were used. Every URL recorded here is
    on kraken.tech, tako.kraken.tech, docs.kraken.tech, or a GitHub org whose declared website is
    kraken.tech.
  notInScope: >-
    developer.octopus.energy is Kraken-powered but is Octopus Energy's published surface under its own
    brand and supply licence. It is profiled separately as all/octopus-energy and none of its specs
    were copied here.

