summary: 'Kraken names MCP on two separate surfaces and only one of them is real today. The Open Kraken
  "AI access layer" — MCP gateways that let a licensee''s AI agents orchestrate approved actions inside
  Kraken — is announced and "gradually released", with no server URL, no tool list, no scope model and
  no transport published; mcp.kraken.tech does not resolve in DNS. The one MCP configuration Kraken actually
  publishes is for its Tako design system: a documented, anonymously usable stdio setup that points the
  community `storybook-mcp` server at Kraken''s own PUBLIC Storybook index, so an IDE assistant can read
  Tako component documentation while you code. That config is first-party published and verified live;
  the server binary itself is third-party.'
servers:
- name: tako-storybook
  status: published
  first_party_config: true
  first_party_server_binary: false
  transport: stdio
