  scope: Design-system documentation only. This server exposes Tako component stories and docs to a coding
    assistant. It does NOT reach any Kraken tenant, customer record, or Open Kraken API.
  tools_list_probe: Not applicable — stdio server run locally by the IDE; there is no hosted endpoint
