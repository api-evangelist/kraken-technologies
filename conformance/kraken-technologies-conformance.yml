summary: >-
  Kraken conforms to real organisational security standards (ISO 27001, SOC 1/2, GDPR) and uses two
  genuine technical standards on its public surface: JWT/JWKS for the Embedded Apps proxy and MCP for
  the Tako documentation server (with an announced MCP-based AI access layer). It conforms to no
  energy-sector data standard — no Green Button, ESPI, CDR Consumer Data Standards, OCPP, OCPI,
  OpenADR, IEEE 2030.5 or IEC CIM reference exists anywhere on its public surface — and it publishes
  no API-level conformance (no OpenAPI, no OAuth 2.0, no OIDC, no RFC 9457).
